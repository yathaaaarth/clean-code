<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Panel - QuickPrint</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #eef2f7; color: #0f172a; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  header h1 { font-size: 20px; }
  header .muted { font-size: 13px; color: #64748b; }
  #login { max-width: 360px; margin: 80px auto; background: #fff; border-radius: 14px; padding: 24px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  #login input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; text-align: center; margin: 14px 0; }
  button.primary { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  button.primary:hover { background: #1d4ed8; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .tools button { padding: 9px 14px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
  .tools button:hover { border-color: #2563eb; color: #2563eb; }
  .stats { display: flex; gap: 12px; margin-bottom: 16px; }
  .stat { flex: 1; background: #fff; border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 12px; color: #64748b; }
  .order { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); display: flex; gap: 14px; align-items: center; }
  .order .qno { font-size: 26px; font-weight: 800; color: #2563eb; min-width: 48px; text-align: center; }
  .order .info { flex: 1; }
  .order .info b { display: block; font-size: 15px; }
  .order .info .meta { font-size: 13px; color: #64748b; margin-top: 2px; }
  .order .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { padding: 8px 12px; border: 0; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; }
  .btn-file { background: #e0e7ff; color: #3730a3; }
  .btn-print { background: #2563eb; color: #fff; }
  .btn-done { background: #16a34a; color: #fff; }
  .btn-paid { color: #16a34a; }
  .btn-unpaid { color: #b91c1c; }
  .pill { padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; margin-left: 8px; }
  .pill.waiting { background: #fef3c7; color: #92400e; }
  .pill.printing { background: #dbeafe; color: #1e40af; }
  .pill.done { background: #dcfce7; color: #166534; }
  .empty { text-align: center; color: #94a3b8; padding: 40px 0; }
  .hidden { display: none; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; }
  #modal .box { background: #fff; border-radius: 12px; padding: 20px; max-width: 320px; text-align: center; }
  #modal img { width: 220px; height: 220px; border-radius: 10px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; display: none; }
  .sortbar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .sortbar button { padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 99px; background: #fff; cursor: pointer; font-size: 12px; font-weight: 600; }
  .sortbar button.on { background: #2563eb; color: #fff; border-color: #2563eb; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🖨️ QuickPrint — Shop Panel</h1>
      <div class="muted" id="clock"></div>
    </div>
    <button class="tools" onclick="logout()" style="background:transparent;border:none;color:#64748b;cursor:pointer">Logout</button>
  </header>

  <div id="login">
    <h2>Shopkeeper login</h2>
    <input type="password" id="pin" placeholder="Enter PIN">
    <button class="primary" onclick="login()">Unlock panel</button>
    <p class="muted" style="margin-top:10px;font-size:12px;color:#64748b">PIN is set in server.js (ADMIN_PIN)</p>
  </div>

  <div id="panel" class="hidden">
    <div class="stats">
      <div class="stat"><b id="stWaiting">0</b><span>Waiting</span></div>
      <div class="stat"><b id="stPrinting">0</b><span>Printing</span></div>
      <div class="stat"><b id="stDone">0</b><span>Done today</span></div>
    </div>

    <div class="tools">
      <button onclick="showShopQR()">Show entrance QR code</button>
      <button onclick="refresh()">Refresh now</button>
    </div>

    <div class="card" style="background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <b style="font-size:14px">Print automation</b>
        <label style="font-size:13px;cursor:pointer"><input type="checkbox" id="autoPrintToggle"> Auto-print when payment is confirmed</label>
        <input type="text" id="printerName" placeholder="Printer name (blank = default)" style="padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;min-width:220px">
        <label style="font-size:13px">Clear after <input type="number" id="autoDelay" style="width:60px;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px" min="0"> sec</label>
        <button class="btn-print" style="padding:8px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;font-weight:700" onclick="saveSettings()">Save</button>
        <button class="btn-file" style="padding:8px 14px;border:0;border-radius:8px;background:#e0e7ff;color:#3730a3;cursor:pointer;font-weight:700" onclick="testPrint()">Test print</button>
      </div>
      <div class="muted" id="printStatus" style="font-size:12px;margin-top:8px"></div>
    </div>

    <div class="sortbar">
      <button class="on" data-f="queueNo" onclick="setSort('queueNo',this)">Queue order</button>
      <button data-f="queueNo" onclick="setSort('pickupTime',this)">Pickup time</button>
      <button data-f="queueNo" onclick="setSort('unpaid',this)">Unpaid only</button>
      <label style="margin-left:auto;font-size:13px;color:#64748b">Search: <input id="search" oninput="render()" style="padding:6px 10px;border:1px solid #cbd5e1;border-radius:8px"></label>
    </div>

    <div id="orders"></div>
    <div class="empty hidden" id="emptyBox">No orders yet. Share the entrance QR so customers can upload.</div>
  </div>
</div>

<div id="modal"><div class="box"><h3 style="margin-bottom:10px"></h3><img src="" alt="QR"><button class="primary" style="margin-top:14px" onclick="closeModal()">Close</button></div></div>
<div id="toast"></div>

<script>
let TOKEN = localStorage.getItem('qp_token') || '';
let ORDERS = [], SORT = 'queueNo', Q = 0;
let SPECIAL = {}; // unused placeholder

const $ = id => document.getElementById(id);

function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }

function clock() {
  $('clock').textContent = new Date().toLocaleString();
}

async function login() {
  const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('pin').value }) });
  const d = await r.json();
  if (r.ok) { TOKEN = d.token; localStorage.setItem('qp_token', TOKEN); showPanel(); } else { alert('Wrong PIN'); }
}
function logout() { TOKEN = ''; localStorage.removeItem('qp_token'); location.reload(); }

function showPanel() {
  $('login').classList.add('hidden');
  $('panel').classList.remove('hidden');
  refresh();
  loadSettings();
  setInterval(refresh, 3000);
  setInterval(clock, 1000);
}

async function refresh() {
  if (!TOKEN) return;
  const r = await fetch('/api/orders', { headers: { 'x-admin-token': TOKEN } });
  if (r.status === 401) { logout(); return; }
  const d = await r.json();
  ORDERS = d.orders;
  render();
}

function setSort(f, btn) {
  SORT = f;
  document.querySelectorAll('.sortbar button').forEach(b => b.classList.toggle('on', b === btn));
  Q = 0;
  render();
}

function visibleOrders() {
  const term = $('search').value.toLowerCase();
  let list = ORDERS.filter(o => !term || o.name.toLowerCase().includes(term) || String(o.queueNo) === term || o.paid === (SORT === 'paid'));
  if (SORT === 'unpaid') list = ORDERS.filter(o => !o.paid);
  if (SORT === 'pickupTime') list = [...list].sort((a, b) => (a.pickupTime || '').localeCompare(b.pickupTime || ''));
  else list = [...list].sort((a, b) => a.queueNo - b.queueNo);
  return list;
}

function render() {
  const wrap = $('orders');
  wrap.innerHTML = '';
  const list = visibleOrders();

  const w = ORDERS.filter(o => o.status === 'waiting').length;
  const p = ORDERS.filter(o => o.status === 'printing').length;
  const d = ORDERS.filter(o => o.status === 'done').length;
  $('stWaiting').textContent = w; $('stPrinting').textContent = p; $('stDone').textContent = d;
  $('emptyBox').classList.toggle('hidden', list.length > 0);

  list.forEach(o => {
    const el = document.createElement('div');
    el.className = 'order';
    el.innerHTML = `
      <div class="qno">#${o.queueNo}</div>
      <div class="info">
        <b>${escapeHtml(o.name)} ${o.paid ? '<span class="btn-paid">✓ paid</span>' : '<span class="btn-unpaid">unpaid</span>'}<span class="pill ${o.status}">${o.status}</span></b>
        <div class="meta">${o.phone || 'no phone'} • ${o.pages} pages • ₹${o.amount} • pickup: ${o.pickupTime || 'anytime'}</div>
        <div class="meta">${o.fileName}</div>
      </div>
      <div class="actions">
        ${o.status !== 'done' ? `<button class="btn-file" onclick="viewFile(${o.queueNo})">View</button>
        <button class="btn-file" onclick="downloadFile(${o.queueNo})">Download</button>
        <button class="btn-print" onclick="markPrint(${o.queueNo})">Start printing</button>
        <button class="btn-done" onclick="markDone(${o.queueNo})">Print done &amp; delete ✓</button>` : '<span class="muted" style="font-size:12px;color:#64748b">printed • file deleted</span>'}
      </div>`;
    wrap.appendChild(el);
  });
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function api(url) {
  const r = await fetch(url, { method: 'POST', headers: { 'x-admin-token': TOKEN } });
  if (r.status === 401) { logout(); return null; }
  return r.json();
}

function viewFile(q) { window.open('/api/orders/' + q + '/file/view', '_blank'); }
function downloadFile(q) { window.open('/api/orders/' + q + '/file', '_blank'); }

async function markPrint(q) {
  await api('/api/orders/' + q + '/print');
  refresh();
}
async function markDone(q) {
  if (!confirm('Confirm printing done for #' + q + '?\nThe file will be DELETED from the server.')) return;
  await api('/api/orders/' + q + '/done');
  toast('Order #' + q + ' done, file deleted');
  refresh();
}

async function showShopQR() {
  const d = await (await fetch('/api/qr/shop')).json();
  const box = $('modal');
  box.querySelector('h3').textContent = 'Customers scan to upload';
  box.querySelector('img').src = d.qr;
  box.querySelector('img').alt = d.url;
  box.style.display = 'flex';
}
function closeModal() { $('modal').style.display = 'none'; }

async function loadSettings() {
  const r = await fetch('/api/admin/settings', { headers: { 'x-admin-token': TOKEN } });
  if (r.status === 401) { logout(); return; }
  const d = await r.json();
  $('autoPrintToggle').checked = d.autoPrint;
  $('printerName').value = d.printerName || '';
  $('autoDelay').value = d.autoClearDelaySec;
  const st = $('printStatus');
  st.textContent = d.autoPrint
    ? 'ON - orders start printing automatically the moment payment is confirmed, then clear after ' + d.autoClearDelaySec + 's.'
    : 'OFF - shopkeeper confirms each print manually.';
}
async function saveSettings() {
  const r = await fetch('/api/admin/settings', {
    method: 'POST', headers: { 'x-admin-token': TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify({ autoPrint: $('autoPrintToggle').checked, printerName: $('printerName').value, autoClearDelaySec: Number($('autoDelay').value) })
  });
  if (r.status === 401) { logout(); return; }
  const d = await r.json();
  toast('Print automation saved');
  loadSettings();
}
async function testPrint() {
  await saveSettings();
  $('printStatus').textContent = 'Sending test page to the printer...';
  const r = await fetch('/api/admin/printer/test', { method: 'POST', headers: { 'x-admin-token': TOKEN } });
  const d = await r.json();
  $('printStatus').textContent = r.ok ? 'Test page sent to printer: ' + d.printer : 'Test print failed: ' + (d.error || r.status);
}

if (TOKEN) showPanel();
</script>
</body>
</html>
